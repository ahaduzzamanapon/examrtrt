name: 🚀 Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to exam-arena.lc-synergy.ltd
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🚀 Trigger Deploy Webhook
        run: |
          echo "Calling deploy webhook..."
          RESPONSE=$(curl -fsS --max-time 240 \
            "https://exam-arena.lc-synergy.ltd/deploy_hook.php?token=nxly-deploy-2026-exam-arena" \
            || echo "CURL_FAILED")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q "Deploy complete"; then
            echo "✅ Deploy successful!"
          elif echo "$RESPONSE" | grep -q "CURL_FAILED"; then
            echo "⚠️  Webhook curl failed — trying fallback SCP deploy"
            exit 1
          else
            echo "✅ Webhook triggered."
          fi
